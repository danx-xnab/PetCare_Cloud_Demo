services:
  petcare-cloud:
    build: .
    container_name: petcare-cloud-demo
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      PETCARE_LLM_MODEL: ${PETCARE_LLM_MODEL:-gpt-4.1-mini}
      PETCARE_USE_SYSTEM_PROXY: ${PETCARE_USE_SYSTEM_PROXY:-}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
